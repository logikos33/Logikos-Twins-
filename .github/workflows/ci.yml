name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Revalidação SEMANAL do build da imagem (issue #18): PRs que não tocam
  # worker/ não o rebuildam, e o mundo externo (índices pip, base image, wheel
  # do flashinfer) muda por baixo — a agenda pega a quebra antes do release.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch — não faz sentido pagar
# por CI de um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint, tipos, testes, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test

      - name: build
        run: npm run build
        env:
          # O build do Next avalia rotas; as variáveis precisam existir e passar na
          # validação Zod, mas nenhuma delas é segredo real.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci-secret
          S3_BUCKET: ci
          RUNPOD_WEBHOOK_SECRET: ci-webhook-secret
          ADMIN_TOKEN: ci-admin-token

  python:
    name: python · lint, tipos, testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: instalar ferramental
        # As libs de runtime (fastapi, boto3, opencv) entram para o mypy enxergar
        # tipos reais em vez de Any — sem elas o strict mode vira teatro.
        run: pip install pytest ruff mypy numpy fastapi pydantic httpx boto3 opencv-python-headless

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy worker scripts fake-runpod

      # A fixture é gerada, nunca versionada — sem ela os testes geométricos
      # (a regressão permanente do projeto) se pulariam silenciosamente.
      - name: gerar cena sintética
        run: python scripts/make_fixture.py --out fixtures

      - run: python -m pytest

  gates:
    name: gates · licença e vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Nada de AGPL no caminho servido. Ver ADR-0005.
      - name: gate de licença
        run: python scripts/license_gate.py

      - name: instalar dependências da web
        run: npm ci
        working-directory: apps/web

      # Vulnerabilidade high/critical sem exceção registrada reprova o merge.
      - name: gate de vulnerabilidades
        run: npm run audit:gate
        working-directory: apps/web

  secrets:
    name: gates · segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo — gitleaks varre commits, não só o working tree.
          # Repositório é PÚBLICO desde 2026-07-27 (ver DECISIONS.md): todo push
          # fica visível na hora, então este gate roda ANTES de qualquer coisa
          # chegar ao GHCR ou ao endpoint do RunPod.
          fetch-depth: 0

      - name: instalar gitleaks (versão pinada, checksum verificado)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # --redact: se algo vazar, o LOG do CI (público, é Actions de repo público)
      # não pode virar um segundo vazamento do próprio segredo em texto plano.
      - name: gitleaks — histórico completo do branch
        run: gitleaks detect --source . --redact -v

  worker-image:
    name: worker · build da imagem (sem GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A imagem carrega CUDA + torch (vários GB). Repositório privado paga minutos
      # de CI — o build só roda quando worker/ mudou (custo mínimo é requisito).
      - name: detectar mudanças no worker
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Agenda/manual: builda SEMPRE — é o propósito da revalidação.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base"...HEAD | grep -q '^worker/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push direto (merge em main): mesmo critério, contra o commit anterior.
            if git diff --name-only HEAD^ HEAD | grep -q '^worker/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: build da imagem do worker
        if: steps.changes.outputs.changed == 'true'
        run: docker build -t logikos-twins-worker:ci ./worker

      - name: sem mudanças no worker
        if: steps.changes.outputs.changed != 'true'
        run: echo "worker/ intocado neste diff — build pulado (o pin é o mesmo já validado)."

  spec:
    name: processo · a etapa em curso tem spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SDD é gate, não sugestão: código sem spec não entra. O script lê a etapa
      # declarada em STATUS.md e confere que existe `docs/specs/D<N>-*.md`.
      - name: conferir spec da etapa
        run: python scripts/check_spec.py
