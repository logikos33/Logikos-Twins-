name: Release worker image

# Dispara em tag vX.Y.Z. Repositório é PÚBLICO desde 2026-07-27 — Actions é
# ilimitado, então o build (que carrega CUDA + torch, ~19 GB) segue por aqui em
# vez de exigir push manual de uma máquina local. A imagem publicada no GHCR
# também fica pública (dispensa credencial de registry no endpoint do RunPod —
# ver PLUGIN-CHECKLIST.md P3/P4), mas a mudança de visibilidade em si é
# EXCLUSIVA da interface web do GitHub — não existe endpoint REST para isso
# (verificado na documentação oficial da Packages API antes de escrever este
# workflow). Esse passo fica manual, registrado no PLUGIN-CHECKLIST.md.

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/logikos-twins-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: login no GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadados (tag da imagem = tag do git)
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: build + push
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: digest publicado
        run: echo "digest = ${{ steps.push.outputs.digest }}"
